<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Amada Amante</title>
    <meta name="description" content="Joias que inspiram, conectam e transformam. Descubra nossa coleção e faça parte da nossa rede de revendedoras.">
    <meta name="author" content="Amada Amante" />
    <link rel="canonical" href="https://amadaamante.app/" />

    <!-- PWA / mobile - bootstrap sincrono abaixo troca antes do beforeinstallprompt -->
    <meta id="theme-color" name="theme-color" content="#C1186E" />
    <meta id="mobile-web-app-capable" name="mobile-web-app-capable" content="yes" />
    <meta id="apple-mobile-web-app-capable" name="apple-mobile-web-app-capable" content="yes" />
    <meta id="apple-mobile-web-app-status-bar-style" name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta id="apple-mobile-web-app-title" name="apple-mobile-web-app-title" content="Amada Amante" />
    <link id="apple-touch-icon" rel="apple-touch-icon" href="/icons/loja-192.png?v=20260722e" />
    <link id="app-favicon" rel="icon" type="image/png" sizes="192x192" href="/icons/loja-192.png?v=20260722e" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png?v=20260722e" />
    <link id="pwa-manifest" rel="manifest" href="/manifests/manifest-loja.json" />

    <script>
      // Aplica manifesto/metas imediatamente (antes do React e do beforeinstallprompt).
      (function () {
        var VERSION = "20260722e";
        var path = location.pathname || "/";
        var origin = location.origin;
        var kind = "default";
        var name = "Amada Amante";
        var shortName = "Amada Amante";
        var description = "Loja virtual Amada Amante";
        var startUrl = "/";
        var iconBase = "/icons/loja";
        var theme = "#C1186E";

        if (path.indexOf("/login-admin") === 0 || path.indexOf("/admin") === 0) {
          kind = "admin";
          name = "Amada Amante Admin";
          shortName = "Admin";
          description = "Painel administrativo Amada Amante";
          startUrl = "/login-admin";
          iconBase = "/icons/admin";
        } else if (path.indexOf("/login-sacoleira") === 0 || path.indexOf("/sacoleira") === 0) {
          kind = "sacoleira";
          name = "Amada Amante Sacoleira";
          shortName = "Sacoleira";
          description = "Painel da sacoleira Amada Amante \u2014 loja, pedidos e rede de revenda.";
          startUrl = "/login-sacoleira";
          iconBase = "/icons/sacoleira";
        } else if (path.indexOf("/loja/") === 0) {
          kind = "loja";
          name = "Amada Amante";
          shortName = "Amada Amante";
          description = "Loja virtual Amada Amante";
          var m = path.match(/^\/loja\/([^/]+)/);
          startUrl = m ? "/loja/" + m[1] : "/loja";
          iconBase = "/icons/loja";
        }

        function setMeta(id, content) {
          var el = document.getElementById(id);
          if (el) el.setAttribute("content", content);
        }
        function setHref(id, href) {
          var el = document.getElementById(id);
          if (el) el.setAttribute("href", href);
        }

        document.title = name;
        setMeta("theme-color", theme);
        setMeta("apple-mobile-web-app-title", shortName);

        var icon192 = iconBase + "-192.png?v=" + VERSION;
        var icon512 = iconBase + "-512.png?v=" + VERSION;
        var iconMask = iconBase + "-maskable-512.png?v=" + VERSION;
        setHref("apple-touch-icon", icon192);
        setHref("app-favicon", icon192);

        var manifest = {
          id: origin + startUrl,
          name: name,
          short_name: shortName,
          description: description,
          start_url: origin + startUrl,
          scope: origin + "/",
          display: "standalone",
          orientation: "portrait-primary",
          background_color: "#ffffff",
          theme_color: theme,
          lang: "pt-BR",
          dir: "ltr",
          icons: [
            { src: origin + icon192, sizes: "192x192", type: "image/png", purpose: "any" },
            { src: origin + icon512, sizes: "512x512", type: "image/png", purpose: "any" },
            { src: origin + iconMask, sizes: "512x512", type: "image/png", purpose: "maskable" }
          ]
        };

        var blob = new Blob([JSON.stringify(manifest)], {
          type: "application/manifest+json;charset=utf-8"
        });
        var url = URL.createObjectURL(blob);
        var link = document.getElementById("pwa-manifest");
        if (link) link.setAttribute("href", url);

        if (kind === "admin") {
          window.__ORUS_PWA_FALLBACK__ = "/manifests/manifest-admin.json";
        } else if (kind === "sacoleira") {
          window.__ORUS_PWA_FALLBACK__ = "/manifests/manifest-sacoleira.json";
        } else {
          window.__ORUS_PWA_FALLBACK__ = "/manifests/manifest-loja.json";
        }
      })();
    </script>

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://amadaamante.app/" />
    <meta property="og:title" content="Amada Amante" />
    <meta property="og:description" content="Joias que inspiram, conectam e transformam. Descubra nossa coleção e faça parte da nossa rede de revendedoras." />
    <meta property="og:image" content="https://amadaamante.app/og-amada-amante.jpg?v=20260722f" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Amada Amante" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Amada Amante" />
    <meta name="twitter:description" content="Joias que inspiram, conectam e transformam. Descubra nossa coleção e faça parte da nossa rede de revendedoras." />
    <meta name="twitter:image" content="https://amadaamante.app/og-amada-amante.jpg?v=20260722f" />

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
